<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blueprint Constellation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">◈</div>
          <div>
            <div class="brand-name">Note Blueprint</div>
            <div class="brand-sub">constellation logic</div>
          </div>
        </div>

        <div class="topbar-actions">
          <button class="ghost-button" id="newNoteBtn">+ New node</button>
          <button class="icon-button" id="themeToggle" aria-label="Toggle glow mode">◌</button>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar">
          <div class="panel-header">Palette</div>

          <div class="palette-group">
            <button class="palette-item" data-template="idea">
              <span class="palette-swatch cyan"></span>
              <span>
                <strong>Idea</strong>
                <small>Note node</small>
              </span>
            </button>

            <button class="palette-item" data-template="branch">
              <span class="palette-swatch gold"></span>
              <span>
                <strong>Branch</strong>
                <small>Decision</small>
              </span>
            </button>

            <button class="palette-item" data-template="trigger">
              <span class="palette-swatch pink"></span>
              <span>
                <strong>Trigger</strong>
                <small>Event</small>
              </span>
            </button>

            <button class="palette-item" data-template="variable">
              <span class="palette-swatch violet"></span>
              <span>
                <strong>Variable</strong>
                <small>State</small>
              </span>
            </button>
          </div>

          <div class="mini-stats">
            <div>
              <span class="eyebrow">Nodes</span>
              <strong id="nodeCount">0</strong>
            </div>
            <div>
              <span class="eyebrow">Links</span>
              <strong id="linkCount">0</strong>
            </div>
          </div>
        </aside>

        <main class="canvas-panel">
          <div class="canvas-toolbar">
            <div class="crumbs">Graph / Thought map</div>
            <div class="status-pill" id="saveStatus">Saved</div>
          </div>

          <div class="graph-stage" id="graphStage">
            <svg class="wire-layer" id="wireLayer" aria-hidden="true"></svg>
            <div class="node-layer" id="nodeLayer"></div>
          </div>
        </main>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
