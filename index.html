<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signal Graph</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">◈</div>
          <div>
            <div class="brand-name">Signal Graph</div>
            <div class="brand-sub">osint / it workflow</div>
          </div>
        </div>

        <div class="case-strip" id="caseTabs"></div>

        <div class="topbar-actions">
          <button class="ghost-button" id="newCaseBtn">+ New case</button>
          <button class="ghost-button" id="newNoteBtn">+ New node</button>
          <button class="icon-button" id="themeToggle" aria-label="Toggle glow mode">◌</button>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar left-panel">
          <div class="panel-header">Intel Palette</div>

          <div class="palette-group">
            <button class="palette-item" data-template="recon">
              <span class="palette-swatch cyan"></span>
              <span>
                <strong>Recon</strong>
                <small>Target scan</small>
              </span>
            </button>

            <button class="palette-item" data-template="asset">
              <span class="palette-swatch gold"></span>
              <span>
                <strong>Asset</strong>
                <small>Service / host</small>
              </span>
            </button>

            <button class="palette-item" data-template="indicator">
              <span class="palette-swatch pink"></span>
              <span>
                <strong>Indicator</strong>
                <small>IP / email / hash</small>
              </span>
            </button>

            <button class="palette-item" data-template="evidence">
              <span class="palette-swatch violet"></span>
              <span>
                <strong>Evidence</strong>
                <small>Source / artifact</small>
              </span>
            </button>

            <button class="palette-item" data-template="analysis">
              <span class="palette-swatch teal"></span>
              <span>
                <strong>Analysis</strong>
                <small>Correlation</small>
              </span>
            </button>
          </div>

          <div class="mini-stats">
            <div>
              <span class="eyebrow">Nodes</span>
              <strong id="nodeCount">0</strong>
            </div>
            <div>
              <span class="eyebrow">Links</span>
              <strong id="linkCount">0</strong>
            </div>
          </div>
        </aside>

        <main class="canvas-panel">
          <div class="canvas-toolbar">
            <div class="crumbs">Investigation / Map</div>
            <div class="toolbar-filters" id="filterChips">
              <button class="filter-chip active" data-filter="all">All</button>
              <button class="filter-chip" data-filter="recon">Recon</button>
              <button class="filter-chip" data-filter="asset">Assets</button>
              <button class="filter-chip" data-filter="indicator">Indicators</button>
              <button class="filter-chip" data-filter="evidence">Evidence</button>
              <button class="filter-chip" data-filter="analysis">Analysis</button>
            </div>
            <div class="status-pill" id="saveStatus">Saved</div>
          </div>

          <div class="graph-stage" id="graphStage">
            <svg class="wire-layer" id="wireLayer" aria-hidden="true"></svg>
            <div class="node-layer" id="nodeLayer"></div>
          </div>
        </main>

        <aside class="sidebar right-panel">
          <div class="panel-header">Case Inspector</div>

          <div class="case-card">
            <div class="case-title-row">
              <div class="case-badge">Case</div>
              <span class="case-status" id="caseStatus">Open</span>
            </div>
            <h3 id="caseTitleDisplay">Target: Blackstone Labs</h3>
            <p id="caseSummaryDisplay">Initial open-source network review and service enumeration.</p>
          </div>

          <div class="inspector-form" id="inspectorForm">
            <label>
              <span>Title</span>
              <input id="nodeTitleInput" type="text" value="" />
            </label>

            <label>
              <span>Entity</span>
              <input id="nodeEntityInput" type="text" value="" placeholder="domain, ip, host, user" />
            </label>

            <label>
              <span>Summary</span>
              <textarea id="nodeTextInput" rows="4"></textarea>
            </label>

            <div class="two-col">
              <label>
                <span>Severity</span>
                <select id="nodeSeverity">
                  <option value="low">Low</option>
                  <option value="medium">Medium</option>
                  <option value="high">High</option>
                  <option value="critical">Critical</option>
                </select>
              </label>

              <label>
                <span>Confidence</span>
                <select id="nodeConfidence">
                  <option value="low">Low</option>
                  <option value="medium">Medium</option>
                  <option value="high">High</option>
                  <option value="confirmed">Confirmed</option>
                </select>
              </label>
            </div>

            <div class="two-col">
              <label>
                <span>Type</span>
                <input id="nodeTypeInput" type="text" value="" disabled />
              </label>

              <label>
                <span>Source</span>
                <input id="nodeSourceInput" type="text" value="" placeholder="OSINT, scan, dump" />
              </label>
            </div>

            <label>
              <span>Tags</span>
              <input id="nodeTagsInput" type="text" value="" placeholder="public, dns, suspicious" />
            </label>

            <div class="inspector-actions">
              <button type="button" id="saveNodeBtn" class="primary-button">Save node</button>
              <button type="button" id="deleteNodeBtn" class="danger-button">Delete</button>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
